<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="Aplikasi pencatat skor badminton untuk mabar: acak pasangan, catat skor, dan lihat rekap."
    />
    <title>Bultang Match Tracker</title>
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem('bultang.tema')
        var gelap = t === 'gelap' || (t !== 'terang' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (gelap) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
